{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if editando else 'Nuevo' }} producto - WEB-Cántabra{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">{{ 'Editar producto' if editando else 'Registrar nuevo producto' }}</h4>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Código</label>
              <input type="text" name="codigo" maxlength="20" class="form-control" value="{{ datos.get('codigo', '') }}" required>
            </div>
            <div class="col-md-8">
              <label class="form-label">Nombre</label>
              <input type="text" name="nombre" maxlength="100" class="form-control" value="{{ datos.get('nombre', '') }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Categoría</label>
              <input type="text" name="categoria" maxlength="50" class="form-control" value="{{ datos.get('categoria', '') }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Proveedor</label>
              <input type="text" name="proveedor" maxlength="100" class="form-control" value="{{ datos.get('proveedor', '') }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Precio (S/)</label>
              <input type="number" step="0.01" min="0" max="100000" name="precio" class="form-control" value="{{ datos.get('precio', '') }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Stock</label>
              <input type="number" min="0" max="100000" name="stock" class="form-control" value="{{ datos.get('stock', '') }}" required>
            </div>
          </div>
          <div class="mt-4 d-flex gap-2">
            <button class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('catalogo') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
